# 复制为项目根目录 config.toml，填写后端登录账号与密码。
# 账号对应 ccxt-proxy2 的 [users.<username>]，不是交易所 API key。
# 实际 config.toml 不纳入版本控制，由 Just 运行入口在服务启动时读取。
# 字符串中的 $ 和 ${...} 保持字面值，不执行 Shell 或环境变量展开。

[legacy]
# 旧 Notebook 图表库构建后的复制目的地；只展开路径开头的 ~/。
library_target_dir = "~/dev/pyo3-quant/data/lwchart"

[backend]
base_url = "http://127.0.0.1:5123"
# 必须填写实际账号；新看盘服务启动时拒绝空凭据。
username = ""
password = ""
request_timeout_seconds = 60

[server]
# 新入口独立使用 5174，旧 Vite 演示入口仍可使用 5173。
host = "127.0.0.1"
port = 5174

[dashboard]
source = "ccxt"
# local 跟随浏览器时区；也可用 UTC 或 Asia/Shanghai 等 IANA 时区。
timezone = "local"
# 主题：dark 深色、light 浅色；URL 与设置可以覆盖。
theme = "dark"
# 顺序为左上、右上、左下、右下。
layout = "2x2"
timeframes = ["30m", "4h", "1d", "1w"]
# 按顺序使用橙色、绿色、蓝色；空数组表示无指标。
indicators = ["ema,14", "ema,50", "ema,100"]
refresh_seconds = 5
# 初始请求及保留上限：1..10000；URL 和菜单可覆盖，历史不足显示实际返回的数据。
history_bars = 1000

[ccxt]
# CCXT 默认身份。切换到此来源时使用；只读行情，不提供下单。
exchange_name = "binance"
market = "future"
is_live = true
symbol = "BTC/USDT:USDT"

[tq]
# TQ 默认螺纹主连；不是天勤账号配置，仍用 backend 的登录鉴权。
symbol = "KQ.m@SHFE.rb"
